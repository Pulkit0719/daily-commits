name: Daily repository update

on:
  schedule:
    # 09:00 India Standard Time (03:30 UTC)
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update daily activity file
        run: node dailyCommit.js

      - name: Commit and push update
        run: |
          git config user.name "Pulkit0719"
          git config user.email "201331098+Pulkit0719@users.noreply.github.com"
          git add temp.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: daily repository update"
          git push
